name: Human Agent Pilot
on:
  pull_request:
    paths:
      - 'pilots/human-agent-v1/**'
      - 'knowledge-base/schemas/knowledge-record.v0.2.schema.json'
      - '.github/workflows/human-agent-pilot.yml'
permissions:
  contents: read
concurrency:
  group: human-agent-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r pilots/human-agent-v1/requirements.txt
      - run: python -m unittest discover -s pilots/human-agent-v1 -p 'test_*.py' -v
      - run: python pilots/human-agent-v1/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-build-python-${{ matrix.python-version }}
          path: pilots/human-agent-v1/dist/
          if-no-files-found: error
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pilots/human-agent-v1/requirements.txt -r pilots/human-agent-v1/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python pilots/human-agent-v1/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-browser-check
          path: pilots/human-agent-v1/dist-browser/
          if-no-files-found: warn
          retention-days: 7
